binary:
  - name: awscli
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    archive: zip
  - name: kubectl
    url: https://dl.k8s.io/release/$VERSION/bin/linux/amd64/kubectl
    sum: https://dl.k8s.io/release/$VERSION/bin/linux/amd64/kubectl.sha256
    version: v1.34.1

flatpak:
